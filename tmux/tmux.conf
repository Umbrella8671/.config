# tmux configuration
# Based on https://github.com/tmux/tmux/wiki

# ╭────────────────────────────────────────────────────────────────────────────╮
# │ tmux.conf — 主要使用 Option(Alt) 直接快捷键，Ctrl+b 作为备用 Prefix       │
# │ 适配：macOS Terminal / VS Code / Vim / 远程 Linux 服务器                  │
# ╰────────────────────────────────────────────────────────────────────────────╯
#
# macOS Terminal：
#   Settings/Preferences → Profiles → Keyboard → 勾选 “Use Option as Meta key”
#
# VS Code settings.json：
#   "terminal.integrated.macOptionIsMeta": true
#
# 嵌套 tmux（本地 tmux → SSH → 远程 tmux）说明：
#   - Option 快捷键会优先被最外层 tmux 捕获。
#   - 要把 Prefix 发送给内层 tmux：按 Ctrl+b，再按 Ctrl+b。
#   - 例如控制远程 tmux detach：Ctrl+b、Ctrl+b、d。


# ── Server / 终端能力 ─────────────────────────────────────────────────────────
set -s escape-time 0                                                # ESC 无延迟，避免 Vim 模式切换卡顿
set -s extended-keys on                                             # 开启扩展按键支持（功能键、修饰键组合）
set -as terminal-features 'xterm*:extkeys'                          # 对 xterm 类终端启用扩展按键特性
set -g default-terminal "tmux-256color"                             # tmux 内使用 256 色终端类型
set -as terminal-overrides ",xterm-256color:RGB"                    # 为 xterm-256color 启用 24-bit 真彩色

# 如果远程服务器提示 unknown terminal type: tmux-256color，可临时改成：
# set -g default-terminal "screen-256color"


# ── 基础设置 ──────────────────────────────────────────────────────────────────
set -g prefix C-b                                                   # 使用 tmux 默认 Prefix：Ctrl+b
set -g prefix2 None                                                 # 不设置第二 Prefix，避免与其他快捷键冲突
unbind C-a                                                          # 清除可能由系统配置遗留的 Ctrl+a Prefix 表绑定
bind C-b send-prefix                                                # Ctrl+b、Ctrl+b：把 Prefix 发送给内层 tmux

set -g mouse on                                                     # 鼠标点击面板、滚轮翻页、拖拽调整大小
set -g history-limit 100000                                         # 每个面板保存 10 万行历史
set -g buffer-limit 20                                              # 最多保留 20 个 tmux 复制缓冲区
set -g display-time 1500                                            # 状态提示显示 1.5 秒
set -g focus-events on                                              # 透传焦点事件，供 Vim / VS Code autoread 使用
set -g base-index 1                                                 # 窗口编号从 1 开始
set -g pane-base-index 1                                            # 面板编号从 1 开始
set -g renumber-windows on                                          # 关闭窗口后自动连续编号
set -g set-clipboard on                                             # 允许通过 OSC 52 与外层终端同步剪贴板
set -g detach-on-destroy off                                        # 当前 Session 被销毁时，优先切换到其他 Session


# ── 窗口与 Session 管理 ───────────────────────────────────────────────────────
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded" # Option+r：重新加载配置
bind -n M-c new-window -c "#{pane_current_path}"                    # Option+c：在当前目录新建窗口
bind -n M-w choose-tree -Zw                                         # Option+w：打开 Session/窗口树形选择器
bind -n M-d detach                                                  # Option+d：detach 当前 tmux 客户端
bind -n M-] next-window                                             # Option+]：切换到下一个窗口
bind -n M-[ previous-window                                         # Option+[：切换到上一个窗口

# Option+1～5：直接跳转到对应编号的窗口
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5


# ── 分屏与布局 ────────────────────────────────────────────────────────────────
bind -n M-v split-window -hc "#{pane_current_path}"                 # Option+v：左右分屏，新面板继承当前目录
bind -n M-s split-window -vc "#{pane_current_path}"                 # Option+s：上下分屏，新面板继承当前目录
bind -n M-m resize-pane -Z                                          # Option+m：最大化当前面板；再次按下恢复
bind -n M-= select-layout even-horizontal                           # Option+=：所有面板左右均分
bind -n M-- select-layout even-vertical                             # Option+-：所有面板上下均分
bind -n M-x confirm-before -p "kill pane? (y/n)" kill-pane          # Option+x：确认后关闭当前面板


# ── 面板导航与尺寸调整 ────────────────────────────────────────────────────────
bind -n M-h select-pane -L                                          # Option+h：切换到左侧面板
bind -n M-j select-pane -D                                          # Option+j：切换到下方面板
bind -n M-k select-pane -U                                          # Option+k：切换到上方面板
bind -n M-l select-pane -R                                          # Option+l：切换到右侧面板

# 大写字母表示需要同时按 Shift；调整边界后，面板可能扩大或缩小
bind -n M-H resize-pane -L 5                                        # Option+Shift+h：向左移动边界 5 格
bind -n M-J resize-pane -D 5                                        # Option+Shift+j：向下移动边界 5 格
bind -n M-K resize-pane -U 5                                        # Option+Shift+k：向上移动边界 5 格
bind -n M-L resize-pane -R 5                                        # Option+Shift+l：向右移动边界 5 格


# ── 复制模式（Vi 风格，兼容 macOS 与远程 Linux）──────────────────────────────
setw -g mode-keys vi                                                # 复制模式使用 Vi 按键
set  -g status-keys vi                                              # tmux 命令行也使用 Vi 按键
bind -n M-Enter copy-mode                                           # Option+Enter：进入复制模式

# 复制模式内快捷键
bind -T copy-mode-vi v      send -X begin-selection                 # v：开始字符选择
bind -T copy-mode-vi V      send -X select-line                     # V：选择整行
bind -T copy-mode-vi C-v    send -X rectangle-toggle                # Ctrl+v：切换矩形块选择
bind -T copy-mode-vi H      send -X start-of-line                   # H：跳到当前行行首
bind -T copy-mode-vi L      send -X end-of-line                     # L：跳到当前行行尾
bind -T copy-mode-vi Escape send -X cancel                          # Escape：退出复制模式

# 先移除 tmux 默认的“鼠标松开即退出复制模式”行为，再按系统能力重新绑定
unbind -T copy-mode-vi MouseDragEnd1Pane

# macOS 本机存在 pbcopy 时：复制到 tmux 缓冲区和 macOS 系统剪贴板。
# 远程 Linux 通常没有 pbcopy：改为复制到 tmux 缓冲区，并通过 set-clipboard/OSC 52
# 尝试同步到本地终端剪贴板。终端是否允许 OSC 52 取决于本地终端设置。
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"' \
    'bind -T copy-mode-vi y send -X copy-selection-and-cancel'

if-shell 'command -v pbcopy >/dev/null 2>&1' \
    'bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"' \
    'bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection'

# macOS 本机：Option+p 读取系统剪贴板后粘贴。
# 远程 Linux：Option+p 粘贴 tmux 自己的最近缓冲区；本地 Mac 剪贴板可直接用 Command+v。
if-shell 'command -v pbpaste >/dev/null 2>&1' \
    'bind -n M-p run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"' \
    'bind -n M-p paste-buffer'


# ── 状态栏 ───────────────────────────────────────────────────────────────────
set -g status on                                                                                  # 显示底部状态栏
set -g status-position bottom                                                                     # 状态栏位于底部
set -g status-interval 5                                                                          # 每 5 秒刷新时间和状态
set -g status-left-length 50                                                                      # 状态栏左侧最大宽度
set -g status-right-length 80                                                                     # 状态栏右侧最大宽度

# ------------ 粉色主题（当前启用）------------
set -g status-style 'bg=#f0f0f0,fg=#ff85ad'                                                       # 浅灰背景、粉色文字
set -g status-left '#[fg=#ffffff,bg=#ff85ad,bold] #S #[fg=#ff85ad,bg=#f0f0f0,nobold]  '           # 左侧显示 Session 名称
set -g status-right '#[fg=#999999]%Y-%m-%d  #[fg=#333333,bold]%H:%M '                             # 右侧显示日期和时间
set -g window-status-format '#[fg=#b0b0b0] #I  #W '                                               # 非活动窗口样式
set -g window-status-current-format '#[fg=#ffffff,bg=#ff85ad] #I  #W #[fg=#ff85ad,bg=#f0f0f0]'    # 当前窗口样式
set -g window-status-activity-style 'fg=#ff4d94'                                                  # 后台窗口有输出时变深粉色

# ------------ 蓝色主题（需要时取消注释，并注释粉色主题）------------
# set -g status-style 'bg=#e8e8e8,fg=#333333'
# set -g status-left '#[fg=#ffffff,bg=#4a7eda,bold] #S #[fg=#4a7eda,bg=#e8e8e8,nobold]  '
# set -g status-right '#[fg=#888888]%Y-%m-%d  #[fg=#333333,bold]%H:%M '
# set -g window-status-format '#[fg=#888888] #I  #W '
# set -g window-status-current-format '#[fg=#ffffff,bg=#4a7eda] #I  #W #[fg=#4a7eda,bg=#e8e8e8]'
# set -g window-status-activity-style 'fg=#cc3333'

set -g window-status-separator ''                                                             # 窗口标签之间不显示分隔符
set -g monitor-activity on                                                                    # 监控后台窗口输出活动
set -g visual-activity off                                                                    # 只改变窗口标签颜色，不弹出提示框


# ── 面板边框 ──────────────────────────────────────────────────────────────────
# ------------ 粉色主题（当前启用）------------
set -g pane-border-style 'fg=#dddddd'                                                          # 非活动面板：浅灰色
set -g pane-active-border-style 'fg=#ff85ad'                                                   # 当前面板：粉色高亮

# ------------ 蓝色主题（需要时取消注释，并注释粉色主题）------------
# set -g pane-border-style 'fg=#cccccc'
# set -g pane-active-border-style 'fg=#4a7eda'

set -g pane-border-lines single                                                                # 使用单线边框
set -g pane-border-status off                                                                  # 不在面板边框上显示标题


# ── tmux 消息提示 ─────────────────────────────────────────────────────────────
# ------------ 粉色主题（当前启用）------------
set -g message-style 'fg=#ffffff,bg=#ff85ad,bold'

# ------------ 蓝色主题（需要时取消注释，并注释粉色主题）------------
# set -g message-style 'fg=#ffffff,bg=#4a7eda,bold'
