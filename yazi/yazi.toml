#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "mtime"
show_hidden = false
show_symlink = true
scrolloff = 8
mouse_events = ["click", "scroll", "drag"]

[preview]
wrap = "yes"
tab_size = 2
max_width = 900
max_height = 900
image_delay = 100
image_filter = "triangle"
image_quality = 75

[input]
cursor_blink = true

[which]
sort_by = "key"
sort_sensitive = false
sort_reverse = false
sort_translit = false

[opener]
edit = [
  { run = "vim %s < /dev/tty > /dev/tty", block = true, for = "unix" },
]

[plugin]
prepend_previewers = [
  { mime = "image/*", run = "noop" },
]
prepend_preloaders = [
  { mime = "image/*", run = "noop" },
]
