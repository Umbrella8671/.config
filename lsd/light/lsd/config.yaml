classic: false

blocks:
  - permission
  - user
  - group
  - size
  - date
  - name

color:
  when: auto
  theme: custom

date: date

dereference: false

icons:
  when: auto
  theme: fancy
  separator: " "

indicators: false

layout: grid

recursion:
  enabled: false
  depth: 3

size: short

permission: rwx

sorting:
  column: name
  reverse: false
  dir-grouping: first

no-symlink: false

total-size: false

hyperlink: never

symlink-arrow: " -> "
